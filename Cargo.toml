[package]
name = "insighta-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["query"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
csv = "1.4.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rand = "0.9.4"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["form", "json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
tokio = { version = "1.51.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }
dotenv = "0.15.0"

